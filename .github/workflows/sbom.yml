name: SBOM

# Declared-inventory SBOM (fails on inventory/Compose/Quadlet drift), a Syft
# scan of the repository and a Grype vulnerability report on the image SBOMs,
# uploaded as a workflow artifact. Runs when image references or the inventory
# change, and weekly. Registry image scans take a few minutes, so they run on
# manual dispatch only. Output is never committed.

on:
  push:
    branches: [main]
    paths:
      - docker-compose.yml
      - quadlets/*.container
      - k8s/**
      - sbom/**
      - scripts/generate-sbom.py
      - scripts/scan-image-sboms.py
      - scripts/ami/grafana-clickhouse-plugin.version
      - .github/workflows/sbom.yml
  pull_request:
    paths:
      - docker-compose.yml
      - quadlets/*.container
      - k8s/**
      - sbom/**
      - scripts/generate-sbom.py
      - scripts/scan-image-sboms.py
      - scripts/ami/grafana-clickhouse-plugin.version
      - .github/workflows/sbom.yml
  # Weekly Grype pass over the committed image SBOMs picks up new CVEs.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      scan_images:
        description: Also scan runtime images from the registry (linux/arm64)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Declared inventory
        run: python3 scripts/generate-sbom.py --output-dir out/declared

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        id: syft
        with:
          syft-version: v1.56.0

      - name: Repository scan
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        # sbom/ holds image scan evidence; Syft would re-catalog those SBOMs.
        run: '"$SYFT" scan dir:. -q --exclude "./sbom/**" -o cyclonedx-json@1.6=out/repository.cdx.json'

      - name: Image scans
        if: inputs.scan_images
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: python3 scripts/scan-image-sboms.py --syft "$SYFT" --output-dir out/registry-snapshot

      - uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: grype
        with:
          grype-version: v0.121.1
          cache-db: true

      - name: Vulnerability scan
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        # Fresh image SBOMs when dispatched, otherwise the committed snapshot.
        # Report only: findings do not fail the job.
        run: |
          src=out/registry-snapshot
          [ -d "$src" ] || src=sbom/registry-snapshot
          mkdir -p out/vulnerabilities
          for sbom in "$src"/*.cdx.json; do
            id=$(basename "$sbom" .cdx.json)
            "$GRYPE" -q "sbom:$sbom" -o table="out/vulnerabilities/$id.txt" -o json="out/vulnerabilities/$id.grype.json"
          done
          "$GRYPE" db status > out/vulnerabilities/db-status.txt
          python3 - "$src" out/vulnerabilities/*.grype.json >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import collections, json, pathlib, sys
          levels = ["Critical", "High", "Medium", "Low", "Negligible", "Unknown"]
          print(f"### Grype findings for `{sys.argv[1]}`\n")
          print("| Image | " + " | ".join(levels) + " | Fix available |")
          print("|---|" + "---:|" * (len(levels) + 1))
          for path in map(pathlib.Path, sys.argv[2:]):
              matches = json.loads(path.read_text(encoding="utf-8"))["matches"]
              counts = collections.Counter(m["vulnerability"]["severity"] for m in matches)
              fixed = sum(m["vulnerability"]["fix"]["state"] == "fixed" for m in matches)
              row = [path.name.removesuffix(".grype.json")] + [str(counts[level]) for level in levels] + [str(fixed)]
              print("| " + " | ".join(row) + " |")
          print("\nMatches are not deduplicated across binaries or images and are not triaged.")
          EOF

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.sha }}
          path: out/
          if-no-files-found: error
          retention-days: 30
