name: Images

# Builds the three portable ironlog images (contract: images/README.md) for
# linux/amd64 and linux/arm64. Pull requests build without pushing and run the
# amd64 image tests. Pushes to main and manual dispatches push to GHCR with an
# SBOM attestation and report Grype findings (report only, never fails).

on:
  push:
    branches: [main]
    paths: &paths
      - images/**
      - clickhouse/**
      - grafana/**
      - vector/**
      - scripts/ami/grafana-clickhouse-plugin.version
      - scripts/tests/*-image.test.sh
      - .github/workflows/images.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io/jake-kelley

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image: [clickhouse, grafana, vector]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image: [clickhouse, grafana, vector]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The scripts build and run linux/amd64 themselves through DOCKER
      # (default `docker`), which is the runner's native engine.
      - name: ${{ matrix.image }}-image.test.sh
        run: bash "scripts/tests/${{ matrix.image }}-image.test.sh"

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: clickhouse
            arg: CLICKHOUSE_IMAGE
          - image: grafana
            arg: GRAFANA_VERSION
          - image: vector
            arg: VECTOR_IMAGE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tags per images/README.md: <upstream version>-<git short sha> and a
      # moving <upstream version>. The version is the Dockerfile ARG value
      # (an image reference's tag part), minus any variant suffix (-debian).
      - name: Tags
        id: meta
        env:
          ARG: ${{ matrix.arg }}
          IMAGE: ${{ matrix.image }}
        run: |
          value=$(sed -nE "s/^ARG ${ARG}=(.*)$/\1/p" "images/${IMAGE}/Dockerfile")
          version=${value##*:}
          version=${version%%-*}
          [ -n "$version" ] || { echo "no upstream version for $IMAGE" >&2; exit 1; }
          name="${REGISTRY}/ironlog-${IMAGE}"
          {
            echo "tags<<EOF"
            echo "${name}:${version}-${GITHUB_SHA::7}"
            echo "${name}:${version}"
            echo "EOF"
            echo "name=${name}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          sbom: true
          provenance: mode=min
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      - uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: grype
        with:
          grype-version: v0.121.1
          cache-db: true

      - name: Vulnerability scan
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
          NAME: ${{ steps.meta.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          GRYPE_REGISTRY_AUTH_AUTHORITY: ghcr.io
          GRYPE_REGISTRY_AUTH_USERNAME: ${{ github.actor }}
          GRYPE_REGISTRY_AUTH_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        # Report only: findings do not fail the job.
        run: |
          mkdir -p out
          for platform in linux/amd64 linux/arm64; do
            "$GRYPE" -q --platform "$platform" "registry:${NAME}@${DIGEST}" -o json="out/${platform//\//-}.grype.json"
          done
          python3 - "$NAME@$DIGEST" out/*.grype.json >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import collections, json, pathlib, sys
          levels = ["Critical", "High", "Medium", "Low", "Negligible", "Unknown"]
          print(f"### Grype findings for `{sys.argv[1]}`\n")
          print("| Platform | " + " | ".join(levels) + " | Fix available |")
          print("|---|" + "---:|" * (len(levels) + 1))
          for path in map(pathlib.Path, sys.argv[2:]):
              matches = json.loads(path.read_text(encoding="utf-8"))["matches"]
              counts = collections.Counter(m["vulnerability"]["severity"] for m in matches)
              fixed = sum(m["vulnerability"]["fix"]["state"] == "fixed" for m in matches)
              row = [path.name.removesuffix(".grype.json").replace("-", "/", 1)] + [str(counts[level]) for level in levels] + [str(fixed)]
              print("| " + " | ".join(row) + " |")
          print("\nMatches are not deduplicated across binaries and are not triaged.")
          EOF
