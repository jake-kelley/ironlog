# Vector unit tests for the Phase 2 VRL transforms. Dev-time only (not mounted
# into the container). Run:
#   docker run --rm -v "$PWD/vector:/cfg:ro" -e AWS_REGION=x -e SQS_URL_CLOUDTRAIL=x \
#     -e SQS_URL_GUARDDUTY=x -e SQS_URL_VPCFLOW=x -e SQS_URL_S3ACCESS=x -e CH_VECTOR_PASSWORD=x \
#     timberio/vector:0.57.0-debian test /cfg/vector.yaml /cfg/tests.yaml

tests:
  - name: cloudtrail_fanout_and_mapping
    inputs:
      - insert_at: cloudtrail_unwrap
        type: log
        log_fields:
          message: '{"Records":[{"eventVersion":"1.09","eventTime":"2026-07-10T12:34:56Z","eventSource":"signin.amazonaws.com","eventName":"ConsoleLogin","awsRegion":"us-east-1","sourceIPAddress":"198.51.100.7","userAgent":"Mozilla/5.0","userIdentity":{"type":"Root","arn":"arn:aws:iam::111122223333:root"},"recipientAccountId":"111122223333","eventID":"evt-1","requestID":"req-1","readOnly":false,"eventCategory":"Management","errorMessage":"Failed authentication"},{"eventVersion":"1.09","eventTime":"2026-07-10T13:00:00Z","eventSource":"iam.amazonaws.com","eventName":"CreateUser","awsRegion":"us-east-1","sourceIPAddress":"203.0.113.9","userAgent":"aws-cli/2.15","userIdentity":{"type":"IAMUser","arn":"arn:aws:iam::111122223333:user/admin"},"recipientAccountId":"111122223333","eventID":"evt-2","requestID":"req-2","readOnly":false,"eventCategory":"Management"}]}'
    outputs:
      - extract_from: cloudtrail_map
        conditions:
          - type: vrl
            source: |-
              assert_eq!(.event_name, "ConsoleLogin")
              assert_eq!(.principal_type, "Root")
              assert_eq!(.aws_account, "111122223333")
              assert_eq!(.error_message, "Failed authentication")
              assert_eq!(.error_code, "")
              assert_eq!(.read_only, false)
              assert_eq!(.event_id, "evt-1")
              assert_eq!(.event_time, to_unix_timestamp(parse_timestamp!("2026-07-10T12:34:56Z", "%+")))
              assert!(is_string(.raw))
          - type: vrl
            source: |-
              assert_eq!(.event_name, "CreateUser")
              assert_eq!(.event_source, "iam.amazonaws.com")
              assert_eq!(.principal_type, "IAMUser")
              assert_eq!(.event_id, "evt-2")

  - name: cloudtrail_digest_dropped
    inputs:
      - insert_at: cloudtrail_unwrap
        type: log
        log_fields:
          message: '{"awsAccountId":"111122223333","digestS3Bucket":"my-trail-bucket","digestEndTime":"2026-07-10T13:00:00Z"}'
    no_outputs_from: [cloudtrail_map]

  - name: guardduty_finding_mapping
    inputs:
      - insert_at: guardduty_map
        type: log
        log_fields:
          message: '{"schemaVersion":"2.0","accountId":"111122223333","region":"us-east-1","id":"f-abc","type":"UnauthorizedAccess:EC2/SSHBruteForce","severity":5.3,"title":"198.51.100.7 is performing SSH brute force attacks","resource":{"resourceType":"Instance","instanceDetails":{"instanceId":"i-0abc123"}},"service":{"eventFirstSeen":"2026-07-01T00:00:00Z","eventLastSeen":"2026-07-10T00:00:00Z"},"updatedAt":"2026-07-10T01:02:03.000Z"}'
    outputs:
      - extract_from: guardduty_map
        conditions:
          - type: vrl
            source: |-
              assert_eq!(.finding_id, "f-abc")
              assert_eq!(.finding_type, "UnauthorizedAccess:EC2/SSHBruteForce")
              assert_eq!(.severity, 5.3)
              assert_eq!(.resource_type, "Instance")
              assert_eq!(.resource_id, "i-0abc123")
              assert_eq!(.first_seen, to_unix_timestamp(parse_timestamp!("2026-07-01T00:00:00Z", "%+")))
              assert_eq!(.last_seen, to_unix_timestamp(parse_timestamp!("2026-07-10T00:00:00Z", "%+")))

  - name: guardduty_non_finding_dropped
    inputs:
      - insert_at: guardduty_map
        type: log
        log_fields:
          message: '{"note":"not a finding"}'
    no_outputs_from: [guardduty_map]

  - name: vpcflow_accept_line
    inputs:
      - insert_at: vpcflow_map
        type: log
        log_fields:
          message: "2 123456789010 eni-1235b8ca123456789 172.31.16.139 172.31.16.21 20641 22 6 20 4249 1418530010 1418530070 ACCEPT OK"
    outputs:
      - extract_from: vpcflow_map
        conditions:
          - type: vrl
            source: |-
              assert_eq!(.event_time, 1418530010)
              assert_eq!(.end_time, 1418530070)
              assert_eq!(.aws_account, "123456789010")
              assert_eq!(.src_addr, "172.31.16.139")
              assert_eq!(.dst_port, 22)
              assert_eq!(.protocol, 6)
              assert_eq!(.action, "ACCEPT")
              assert_eq!(.log_status, "OK")
              assert_eq!(.bytes, 4249)

  - name: vpcflow_nodata_line_gets_defaults
    inputs:
      - insert_at: vpcflow_map
        type: log
        log_fields:
          message: "2 123456789010 eni-1235b8ca123456789 - - - - - - - 1431280876 1431280934 - NODATA"
    outputs:
      - extract_from: vpcflow_map
        conditions:
          - type: vrl
            source: |-
              assert_eq!(.action, "NONE")
              assert_eq!(.log_status, "NODATA")
              assert_eq!(.src_addr, "::")
              assert_eq!(.dst_addr, "::")
              assert_eq!(.src_port, 0)
              assert_eq!(.packets, 0)

  - name: vpcflow_header_line_dropped
    inputs:
      - insert_at: vpcflow_map
        type: log
        log_fields:
          message: "version account-id interface-id srcaddr dstaddr srcport dstport protocol packets bytes start end action log-status"
    no_outputs_from: [vpcflow_map]

  - name: s3access_line_mapping
    inputs:
      - insert_at: s3access_map
        type: log
        log_fields:
          message: '79a59df900b949e55d96a1e698fbacedfd6e09d98eacf8f8d5218e7cd47ef2be awsexamplebucket1 [06/Feb/2019:00:00:38 +0000] 192.0.2.3 79a59df900b949e55d96a1e698fbacedfd6e09d98eacf8f8d5218e7cd47ef2be 3E57427F3EXAMPLE REST.GET.VERSIONING - "GET /awsexamplebucket1?versioning HTTP/1.1" 200 - 113 - 7 - "-" "S3Console/0.4" -'
    outputs:
      - extract_from: s3access_map
        conditions:
          - type: vrl
            source: |-
              assert_eq!(.bucket, "awsexamplebucket1")
              assert_eq!(.operation, "REST.GET.VERSIONING")
              assert_eq!(.object_key, "")
              assert_eq!(.remote_ip, "192.0.2.3")
              assert_eq!(.http_status, 200)
              assert_eq!(.error_code, "")
              assert_eq!(.bytes_sent, 113)
              assert_eq!(.object_size, 0)
              assert_eq!(.user_agent, "S3Console/0.4")
              assert_eq!(.event_time, to_unix_timestamp(parse_timestamp!("06/Feb/2019:00:00:38 +0000", "%d/%b/%Y:%H:%M:%S %z")))
