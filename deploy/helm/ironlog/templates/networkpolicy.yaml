{{- if .Values.networkPolicy.enabled }}
{{- $root := . }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ironlog.chHost" . }}
  labels:
    {{- include "ironlog.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ironlog.selector" (dict "root" . "component" "clickhouse") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- /* clickhouse itself = future replicas / Keeper traffic */}}
        {{- range $c := list "grafana" "vector" "vector-aws" "schema" "clickhouse" }}
        - podSelector:
            matchLabels:
              {{- include "ironlog.selector" (dict "root" $root "component" $c) | nindent 14 }}
        {{- end }}
      ports:
        - {protocol: TCP, port: 8123}
        - {protocol: TCP, port: 9000}
{{- end }}
