{{- $root := . }}
{{- $sas := dict "clickhouse" .Values.clickhouse.serviceAccount "grafana" .Values.grafana.serviceAccount "vector" .Values.vector.hosts.serviceAccount }}
{{- if .Values.vector.aws.enabled }}{{ $_ := set $sas "vector-aws" .Values.vector.aws.serviceAccount }}{{ end }}
{{- range $name, $sa := $sas }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ironlog.fullname" $root }}-{{ $name }}
  labels:
    {{- include "ironlog.labels" $root | nindent 4 }}
  {{- with $sa.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
