{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ironlog.fullname" . }}
  labels:
    {{- include "ironlog.labels" . | nindent 4 }}
type: Opaque
stringData:
  CLICKHOUSE_PASSWORD: {{ include "ironlog.pw" (dict "root" . "key" "CLICKHOUSE_PASSWORD" "value" .Values.secrets.clickhouseAdminPassword) | quote }}
  CH_VECTOR_PASSWORD: {{ include "ironlog.pw" (dict "root" . "key" "CH_VECTOR_PASSWORD" "value" .Values.secrets.vectorPassword) | quote }}
  CH_GRAFANA_ANALYST_PASSWORD: {{ include "ironlog.pw" (dict "root" . "key" "CH_GRAFANA_ANALYST_PASSWORD" "value" .Values.secrets.grafanaAnalystPassword) | quote }}
  CH_GRAFANA_AUDITOR_PASSWORD: {{ include "ironlog.pw" (dict "root" . "key" "CH_GRAFANA_AUDITOR_PASSWORD" "value" .Values.secrets.grafanaAuditorPassword) | quote }}
  GF_SECURITY_ADMIN_PASSWORD: {{ include "ironlog.pw" (dict "root" . "key" "GF_SECURITY_ADMIN_PASSWORD" "value" .Values.secrets.grafanaAdminPassword) | quote }}
  SPLUNK_HEC_TOKEN: {{ include "ironlog.pw" (dict "root" . "key" "SPLUNK_HEC_TOKEN" "value" .Values.secrets.hecToken) | quote }}
  {{- if .Values.s3.accessKeyId }}
  IRONLOG_S3_ACCESS_KEY_ID: {{ .Values.s3.accessKeyId | quote }}
  {{- end }}
  {{- if .Values.s3.secretAccessKey }}
  IRONLOG_S3_SECRET_ACCESS_KEY: {{ .Values.s3.secretAccessKey | quote }}
  {{- end }}
  {{- if .Values.grafana.database.password }}
  GF_DATABASE_PASSWORD: {{ .Values.grafana.database.password | quote }}
  {{- end }}
  {{- if .Values.vector.aws.accessKeyId }}
  AWS_ACCESS_KEY_ID: {{ .Values.vector.aws.accessKeyId | quote }}
  {{- end }}
  {{- if .Values.vector.aws.secretAccessKey }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.vector.aws.secretAccessKey | quote }}
  {{- end }}
{{- end }}
