# SIEM platform — Podman (default) or Docker via scripts/compose.sh
# Services: ClickHouse (storage/query), Grafana OSS (UI), one-shot schema job.
# Vector host ingestion is always on; AWS ingestion and k3s are optional profiles.
#
# All three services are built from images/<name>/Dockerfile (context = repo
# root; contract in images/README.md) and tagged ironlog-*:local. Configuration
# is baked into the images: there are NO config bind mounts, only named data
# volumes. Build first or let `up` build: scripts/compose.sh up -d --build
# (schema/vector repeat the build of their image so a fresh `up` never tries to
# pull ironlog-*:local from a registry).

services:
  clickhouse:
    build:
      context: .
      dockerfile: images/clickhouse/Dockerfile
    image: ironlog-clickhouse:local
    container_name: siem-clickhouse
    restart: unless-stopped
    environment:
      # Admin account (created by the official image on first start)
      CLICKHOUSE_USER: ${CH_ADMIN_USER}
      CLICKHOUSE_PASSWORD: ${CH_ADMIN_PASSWORD}
      # Service accounts created by ironlog-schema
      CH_VECTOR_PASSWORD: ${CH_VECTOR_PASSWORD}
      CH_GRAFANA_ANALYST_PASSWORD: ${CH_GRAFANA_ANALYST_PASSWORD}
      CH_GRAFANA_AUDITOR_PASSWORD: ${CH_GRAFANA_AUDITOR_PASSWORD}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ports:
      # Loopback by default: ClickHouse is admin-only, a deliberate security
      # property. IRONLOG_CLICKHOUSE_BIND widens it for split-host mode
      # (Grafana/Vector on another host); see quadlets/README.md for the
      # exposure this creates before setting it.
      - "${IRONLOG_CLICKHOUSE_BIND:-127.0.0.1}:8123:8123"   # HTTP
      - "${IRONLOG_CLICKHOUSE_BIND:-127.0.0.1}:9000:9000"   # native
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    # Explicit (not just the image HEALTHCHECK): podman builds OCI images by
    # default and OCI drops HEALTHCHECK.
    healthcheck:
      test: ["CMD", "/usr/local/bin/ironlog-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # One-shot: applies DDL, service accounts and TTLs against clickhouse, then
  # VERIFIES them and exits non-zero if anything is missing. Dependants wait for
  # it to exit 0 (ClickHouse "healthy" only means SELECT 1 works).
  schema:
    build:
      context: .
      dockerfile: images/clickhouse/Dockerfile
    image: ironlog-clickhouse:local
    container_name: siem-schema
    restart: "no"
    command: ["ironlog-schema"]
    environment:
      CLICKHOUSE_USER: ${CH_ADMIN_USER}
      CLICKHOUSE_PASSWORD: ${CH_ADMIN_PASSWORD}
      CH_VECTOR_PASSWORD: ${CH_VECTOR_PASSWORD}
      CH_GRAFANA_ANALYST_PASSWORD: ${CH_GRAFANA_ANALYST_PASSWORD}
      CH_GRAFANA_AUDITOR_PASSWORD: ${CH_GRAFANA_AUDITOR_PASSWORD}
      IRONLOG_CLICKHOUSE_HOST: clickhouse
    depends_on:
      clickhouse:
        condition: service_healthy

  grafana:
    build:
      context: .
      dockerfile: images/grafana/Dockerfile
    image: ironlog-grafana:local
    container_name: siem-grafana
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # Datasource credentials (referenced by the baked provisioning yaml).
      # Local-auth settings, plugin and datasource host/port are image defaults.
      CH_GRAFANA_ANALYST_PASSWORD: ${CH_GRAFANA_ANALYST_PASSWORD}
      CH_GRAFANA_AUDITOR_PASSWORD: ${CH_GRAFANA_AUDITOR_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      schema:
        condition: service_completed_successfully

  # ---------------------------------------------------------------
  # Phase 3 — Vector aggregator for hosts + Kubernetes (always on).
  # :8088 splunk_hec (K8s clusters push, token in .env)
  # :6000 vector native protocol (Linux agents, vector/agent-linux.yaml)
  vector-hosts:
    build:
      context: .
      dockerfile: images/vector/Dockerfile
    image: ironlog-vector:local
    container_name: siem-vector-hosts
    restart: unless-stopped
    volumes:
      - vector-hosts-buffer:/var/lib/vector
    environment:
      IRONLOG_VECTOR_ROLE: hosts
      CH_VECTOR_PASSWORD: ${CH_VECTOR_PASSWORD}
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN}
    ports:
      - "8088:8088"   # splunk_hec ingest (K8s)
      - "6000:6000"   # vector agent ingest (Linux)
    healthcheck:
      test: ["CMD", "/usr/local/bin/ironlog-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      schema:
        condition: service_completed_successfully

  # ---------------------------------------------------------------
  # Local k3s demo/test cluster (compose profile "k3s") — exercises the K8s
  # ingestion path end-to-end. k8s/vector-shipper.yaml is auto-applied via the
  # k3s manifests dir; the HEC token Secret is created once after first boot:
  #   scripts/compose.sh exec -T k3s kubectl -n siem-logging create secret generic \
  #     siem-hec --from-literal=token=<SPLUNK_HEC_TOKEN from .env>
  # Not part of the SIEM itself — a producer for testing/demo.
  k3s:
    image: docker.io/rancher/k3s:v1.37.1-k3s1
    container_name: siem-k3s
    restart: unless-stopped
    profiles: ["k3s"]
    command: server --disable traefik --disable servicelb
    privileged: true
    tmpfs:
      - /run
      - /var/run
    volumes:
      - k3s-data:/var/lib/rancher/k3s
      - ./k8s/vector-shipper.yaml:/var/lib/rancher/k3s/server/manifests/vector-shipper.yaml:ro,Z
    depends_on:
      vector-hosts:
        condition: service_healthy

  # ---------------------------------------------------------------
  # Phase 2 — Vector aggregator (AWS ingestion).
  # Gated behind the "aws" compose profile: it only starts once real AWS
  # credentials + SQS queue URLs are in .env and COMPOSE_PROFILES=aws is set
  # (or `scripts/compose.sh --profile aws up -d`). Keeps the core stack green
  # before the AWS side is wired up (see docs/aws-ingestion.md).
  vector:
    build:
      context: .
      dockerfile: images/vector/Dockerfile
    image: ironlog-vector:local
    container_name: siem-vector
    restart: unless-stopped
    profiles: ["aws"]
    volumes:
      - vector-buffer:/var/lib/vector
    environment:
      IRONLOG_VECTOR_ROLE: aws
      CH_VECTOR_PASSWORD: ${CH_VECTOR_PASSWORD}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      SQS_URL_CLOUDTRAIL: ${SQS_URL_CLOUDTRAIL:-}
      SQS_URL_GUARDDUTY: ${SQS_URL_GUARDDUTY:-}
      SQS_URL_VPCFLOW: ${SQS_URL_VPCFLOW:-}
      SQS_URL_S3ACCESS: ${SQS_URL_S3ACCESS:-}
    healthcheck:
      test: ["CMD", "/usr/local/bin/ironlog-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    # ports:
    #   - "8088:8088"   # splunk_hec source (Phase 3)
    depends_on:
      schema:
        condition: service_completed_successfully
  # ---------------------------------------------------------------

volumes:
  clickhouse-data:
  grafana-data:
  vector-buffer:
  vector-hosts-buffer:
  k3s-data:
