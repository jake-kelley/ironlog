# SIEM local platform — Podman (default) or Docker via scripts/compose.sh
# Services: ClickHouse (storage/query), Grafana OSS (UI).
# Vector host ingestion is always on; AWS ingestion and k3s are optional profiles.

services:
  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:26.8.34.13
    container_name: siem-clickhouse
    restart: unless-stopped
    environment:
      # Bootstrap admin user (created by the official image on first start)
      CLICKHOUSE_USER: ${CH_ADMIN_USER}
      CLICKHOUSE_PASSWORD: ${CH_ADMIN_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      # Passed through to initdb/99-rbac.sh for service-account creation
      CH_VECTOR_PASSWORD: ${CH_VECTOR_PASSWORD}
      CH_GRAFANA_ANALYST_PASSWORD: ${CH_GRAFANA_ANALYST_PASSWORD}
      CH_GRAFANA_AUDITOR_PASSWORD: ${CH_GRAFANA_AUDITOR_PASSWORD}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/config.d:/etc/clickhouse-server/config.d:ro,Z
      # Mount our lockdown file individually (not the whole dir) so the image
      # entrypoint can still write users.d/default-user.xml when CLICKHOUSE_USER
      # is set. Mounting the directory :ro makes the entrypoint crash-loop.
      - ./clickhouse/users.d/00-lockdown.xml:/etc/clickhouse-server/users.d/00-lockdown.xml:ro,Z
      - ./clickhouse/initdb:/docker-entrypoint-initdb.d:ro,Z
      - ./clickhouse/ddl:/ddl:ro,Z
    ports:
      - "127.0.0.1:8123:8123"   # HTTP — bound to localhost for admin use only
      - "127.0.0.1:9000:9000"   # native — bound to localhost for admin use only
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "${CH_ADMIN_USER}", "--password", "${CH_ADMIN_PASSWORD}", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: docker.io/grafana/grafana-oss:11.4.0
    container_name: siem-grafana
    restart: unless-stopped
    environment:
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL}
      # --- Native local authentication ---
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_AUTH_BASIC_ENABLED: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_GENERIC_OAUTH_ENABLED: "false"
      # --- ClickHouse datasource credentials (referenced by provisioning yaml) ---
      CH_GRAFANA_ANALYST_PASSWORD: ${CH_GRAFANA_ANALYST_PASSWORD}
      CH_GRAFANA_AUDITOR_PASSWORD: ${CH_GRAFANA_AUDITOR_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro,Z
    ports:
      - "3000:3000"
    depends_on:
      clickhouse:
        condition: service_healthy

  # ---------------------------------------------------------------
  # Phase 3 — Vector aggregator for hosts + Kubernetes (always on).
  # :8088 splunk_hec (K8s clusters push, token in .env)
  # :6000 vector native protocol (Linux agents, vector/agent-linux.yaml)
  vector-hosts:
    image: docker.io/timberio/vector:0.57.0-debian
    container_name: siem-vector-hosts
    restart: unless-stopped
    volumes:
      - ./vector/hosts.yaml:/etc/vector/vector.yaml:ro,Z
      - vector-hosts-buffer:/var/lib/vector
    environment:
      # Vector >=0.57 disables ${VAR} interpolation in configs by default;
      # our configs deliberately pull secrets from the environment.
      VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION: "true"
      CH_VECTOR_PASSWORD: ${CH_VECTOR_PASSWORD}
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN}
    ports:
      - "8088:8088"   # splunk_hec ingest (K8s)
      - "6000:6000"   # vector agent ingest (Linux)
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8686 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q 200 <&3"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      clickhouse:
        condition: service_healthy

  # ---------------------------------------------------------------
  # Local k3s demo/test cluster (compose profile "k3s") — exercises the K8s
  # ingestion path end-to-end. k8s/vector-shipper.yaml is auto-applied via the
  # k3s manifests dir; the HEC token Secret is created once after first boot:
  #   scripts/compose.sh exec -T k3s kubectl -n siem-logging create secret generic \
  #     siem-hec --from-literal=token=<SPLUNK_HEC_TOKEN from .env>
  # Not part of the SIEM itself — a producer for testing/demo.
  k3s:
    image: docker.io/rancher/k3s:v1.35.6-k3s1
    container_name: siem-k3s
    restart: unless-stopped
    profiles: ["k3s"]
    command: server --disable traefik --disable servicelb
    privileged: true
    tmpfs:
      - /run
      - /var/run
    volumes:
      - k3s-data:/var/lib/rancher/k3s
      - ./k8s/vector-shipper.yaml:/var/lib/rancher/k3s/server/manifests/vector-shipper.yaml:ro,Z
    depends_on:
      vector-hosts:
        condition: service_healthy

  # ---------------------------------------------------------------
  # Phase 2 — Vector aggregator (AWS ingestion).
  # Gated behind the "aws" compose profile: it only starts once real AWS
  # credentials + SQS queue URLs are in .env and COMPOSE_PROFILES=aws is set
  # (or `scripts/compose.sh --profile aws up -d`). Keeps the core stack green
  # before the AWS side is wired up (see docs/aws-ingestion.md).
  vector:
    image: docker.io/timberio/vector:0.57.0-debian
    container_name: siem-vector
    restart: unless-stopped
    profiles: ["aws"]
    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro,Z
      - vector-buffer:/var/lib/vector
    environment:
      # Vector >=0.57 disables ${VAR} interpolation in configs by default;
      # our configs deliberately pull secrets from the environment.
      VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION: "true"
      CH_VECTOR_PASSWORD: ${CH_VECTOR_PASSWORD}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      SQS_URL_CLOUDTRAIL: ${SQS_URL_CLOUDTRAIL:-}
      SQS_URL_GUARDDUTY: ${SQS_URL_GUARDDUTY:-}
      SQS_URL_VPCFLOW: ${SQS_URL_VPCFLOW:-}
      SQS_URL_S3ACCESS: ${SQS_URL_S3ACCESS:-}
    # ports:
    #   - "8088:8088"   # splunk_hec source (Phase 3)
    depends_on:
      clickhouse:
        condition: service_healthy
  # ---------------------------------------------------------------

volumes:
  clickhouse-data:
  grafana-data:
  vector-buffer:
  vector-hosts-buffer:
  k3s-data:
